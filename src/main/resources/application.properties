spring.application.name=api-pedidos
server.port=${PORT:8080}

# Base de datos
# - En local, si no hay variables, usa H2 en memoria (no hay que instalar nada).
# - Para MySQL: DB_URL=jdbc:mysql://localhost:3306/wc_pedidos?createDatabaseIfNotExist=true
# - En Render: DB_URL=jdbc:postgresql://HOST:5432/BASE (el driver se detecta solo por la URL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:pedidosdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.override-with-generic-response=false
